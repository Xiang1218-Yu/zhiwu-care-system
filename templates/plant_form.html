<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}} · 植物养护日记</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">植物<span>·</span>日记</a><a href="/" class="button secondary">返回列表</a></nav><main class="form-wrap"><div class="form-card"><div class="eyebrow">Plant profile</div><h1>{{.Title}}</h1><p class="subtle">记录它是谁、从哪里来，以及它现在生活在哪里。</p>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}<form method="post" action="{{.Action}}" enctype="multipart/form-data"><div class="form-grid"><div class="field"><label>植物昵称</label><input name="name" value="{{.Plant.Name}}" placeholder="例如：小橘" required></div><div class="field"><label>品种</label><input name="species" value="{{.Plant.Species}}" placeholder="例如：龟背竹" required></div><div class="field"><label>入手日期</label><input type="date" name="acquired_date" value="{{date .Plant.AcquiredDate}}" required></div><div class="field"><label>入手来源</label><select name="source" required><option value="market" {{if eq .Plant.Source "market"}}selected{{end}}>花市</option><option value="online" {{if eq .Plant.Source "online"}}selected{{end}}>网购</option><option value="friend" {{if eq .Plant.Source "friend"}}selected{{end}}>朋友送的</option></select></div><div class="field"><label>所在位置</label><select name="location" required><option value="balcony" {{if eq .Plant.Location "balcony"}}selected{{end}}>阳台</option><option value="living-room" {{if eq .Plant.Location "living-room"}}selected{{end}}>客厅</option><option value="bedroom" {{if eq .Plant.Location "bedroom"}}selected{{end}}>卧室</option><option value="study" {{if eq .Plant.Location "study"}}selected{{end}}>书房</option></select></div><div class="field"><label>养护难度</label><select name="difficulty" required><option value="easy" {{if eq .Plant.Difficulty "easy"}}selected{{end}}>好养</option><option value="medium" {{if eq .Plant.Difficulty "medium"}}selected{{end}}>一般</option><option value="hard" {{if eq .Plant.Difficulty "hard"}}selected{{end}}>需要细心</option></select></div><div class="field"><label>植物状态</label><select name="status" required><option value="healthy" {{if eq .Plant.Status "healthy"}}selected{{end}}>健康</option><option value="yellowing" {{if eq .Plant.Status "yellowing"}}selected{{end}}>黄叶</option><option value="pests" {{if eq .Plant.Status "pests"}}selected{{end}}>虫害</option><option value="gone" {{if eq .Plant.Status "gone"}}selected{{end}}>已送人</option><option value="dead" {{if eq .Plant.Status "dead"}}selected{{end}}>已枯萎</option></select></div><div class="field"><label>头像照片</label><input type="file" name="avatar" accept=".jpg,.jpeg,.png,.webp"><small class="subtle">支持 JPG、PNG、WEBP，最大 8MB</small></div></div><div class="form-actions"><button class="button" type="submit">{{.Submit}}</button><a class="button secondary" href="/">取消</a></div></form></div></main></div></body></html>
